# MQTT-Broker der ELMA-Box: nur im LAN, nur mit Passwort.
# Die Passwortdatei legt ./setup.sh an (mosquitto_passwd).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# ELMA braucht nur den aktuellen Wert, daher nichts auf die SD-Karte schreiben
persistence false
log_dest stdout
