# Baut fertige Images für die ELMA-Box:
#   ghcr.io/womat/elma-backend, ghcr.io/womat/elma-bridge und ghcr.io/womat/elma-push-proxy, jeweils für amd64 und arm64.
# Auf einem Pi Zero 2 W wäre ein Build vor Ort zu langsam und bräuchte zu viel Speicher.
# Läuft nur von Hand: GitHub → Actions → release → "Run workflow", dabei unter "Use workflow from"
# den Versions-Tag (z. B. v0.4.0) wählen – dann bekommen die Images diesen Tag und "latest".
# Zum Ausprobieren das Häkchen "Images hochladen" entfernen: Dann wird alles gebaut, aber nichts veröffentlicht.
# Actions sind auf den Commit-SHA ihres Releases festgenagelt (Version im Kommentar): ein Tag wie @v5
# lässt sich auf anderen Code umbiegen, ein SHA nicht. Updates schlägt dependabot vor (.github/dependabot.yml).
name: release

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Images hochladen (ohne Häkchen: nur testen, nichts wird veröffentlicht)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # kein automatischer pnpm-Cache: pnpm kommt erst im nächsten Schritt über corepack
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable && pnpm install --frozen-lockfile
      # Bekannte Sicherheitslücken in den npm-Paketen (ab "high") lassen den Lauf scheitern.
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm typecheck

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [backend, bridge, push-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/elma-${{ matrix.target }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          build-args: ELMA_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
