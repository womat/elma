# Baut fertige Images für die ELMA-Box:
#   ghcr.io/womat/elma-backend, ghcr.io/womat/elma-bridge und ghcr.io/womat/elma-push-proxy, jeweils für amd64 und arm64.
# Auf einem Pi Zero 2 W wäre ein Build vor Ort zu langsam und bräuchte zu viel Speicher.
# Läuft nur von Hand: GitHub → Actions → release → "Run workflow", dabei unter "Use workflow from"
# den Versions-Tag (z. B. v0.4.0) wählen – dann bekommen die Images diesen Tag und "latest".
name: release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # kein automatischer pnpm-Cache: pnpm kommt erst im nächsten Schritt über corepack
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [backend, bridge, push-proxy]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/elma-${{ matrix.target }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ELMA_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
