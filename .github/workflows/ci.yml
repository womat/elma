# Tests und Typprüfung bei jedem Push und Pull Request (gleiche Schritte wie der Job "test" in release.yml).
# Actions sind auf den Commit-SHA ihres Releases festgenagelt (Version im Kommentar): ein Tag wie @v5
# lässt sich auf anderen Code umbiegen, ein SHA nicht. Updates schlägt dependabot vor (.github/dependabot.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # kein automatischer pnpm-Cache: pnpm kommt erst im nächsten Schritt über corepack
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable && pnpm install --frozen-lockfile
      # Bekannte Sicherheitslücken in den npm-Paketen (ab "high") lassen den Lauf scheitern.
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm typecheck
