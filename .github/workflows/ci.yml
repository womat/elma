# Tests und Typprüfung bei jedem Push und Pull Request (gleiche Schritte wie der Job "test" in release.yml).
# Actions sind auf den Commit-SHA ihres Releases festgenagelt (Version im Kommentar): ein Tag wie @v5
# lässt sich auf anderen Code umbiegen, ein SHA nicht. Updates schlägt dependabot vor (.github/dependabot.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # kein automatischer pnpm-Cache: pnpm kommt erst im nächsten Schritt über corepack
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
