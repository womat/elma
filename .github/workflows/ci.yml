# Tests und Typprüfung bei jedem Push und Pull Request (gleiche Schritte wie der Job "test" in release.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # kein automatischer pnpm-Cache: pnpm kommt erst im nächsten Schritt über corepack
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
