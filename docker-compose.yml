# Produktiv-Stack für das Gerät im LAN (z. B. Raspberry Pi):
#   docker compose up -d --build
# Werte kommen aus .env (Vorlage: .env.example)
#
# Netze: Das Backend hängt nur im internen Netz und erreicht weder das LAN noch das Internet.
# Falls jemand über die Anmeldung eindringt, kommt er so nicht an andere Dienste im Heimnetz.
# Hinaus dürfen nur cloudflared (Tunnel), die Bridge (MQTT) und der Push-Proxy (nur Push-Dienste).
#
# Hardening as in MAGGIE: every ELMA container runs read-only, without capabilities and with
# no-new-privileges. Nothing writes outside the volume /data (SQLite, backup of scripts/deploy.sh),
# so no tmpfs is needed.
services:
  backend:
    build: { context: ., target: backend, args: { ELMA_VERSION: "${ELMA_VERSION:-dev}" } }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET in .env setzen}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:elma@example.com}
      PUSH_PROXY: http://push-proxy:3128
    volumes:
      - elma-data:/data
    depends_on: [push-proxy]
    # kein Port am Gerät: erreichbar nur über den Tunnel (Passkeys brauchen ohnehin HTTPS)
    networks: [intern]

  push-proxy:
    build: { context: ., target: push-proxy }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [intern, extern]

  bridge:
    build: { context: ., target: bridge, args: { ELMA_VERSION: "${ELMA_VERSION:-dev}" } }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [backend]
    networks: [intern, extern]
    extra_hosts:
      # erlaubt MQTT_URL=mqtt://host.docker.internal:1883, wenn der Broker auf demselben Gerät läuft
      - "host.docker.internal:host-gateway"
    environment:
      MQTT_URL: ${MQTT_URL:-mqtt://mysmarthome:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:?MQTT_TOPIC in .env setzen}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      PAYLOAD_PATH: ${PAYLOAD_PATH:-}
      PAYLOAD_UNIT: ${PAYLOAD_UNIT:-W}
      PAYLOAD_INVERT: ${PAYLOAD_INVERT:-false}
      BACKEND_URL: ws://backend:3000
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      RESERVATION_TOPIC: ${RESERVATION_TOPIC:-elma/reservation}
      BATTERY_TOPIC: ${BATTERY_TOPIC:-}
    profiles: [bridge] # erst starten, wenn DEVICE_TOKEN gesetzt ist

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [backend]
    networks: [intern, extern]
    profiles: [tunnel]

networks:
  intern:
    internal: true
  extern:

volumes:
  elma-data:
